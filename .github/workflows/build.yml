name: Build 26.3-fabric

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Bundled Not Siloed
        uses: actions/checkout@v4
        with:
          path: bundled-not-siloed

      - name: Check out matching Stacks Not Slots port
        uses: actions/checkout@v4
        with:
          repository: CappleApple/stacksnotslots
          ref: cappleapple/26.3-fabric
          path: stacks-not-slots

      - name: Set up Java 25 for Gradle
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test matching projects
        working-directory: bundled-not-siloed
        run: bash ports/build-port.sh 26.3-fabric test build runGameTestServer --no-daemon

      - name: Upload production JARs
        uses: actions/upload-artifact@v4
        with:
          name: 26.3-fabric
          if-no-files-found: error
          path: |
            bundled-not-siloed/ports/26.3-fabric/build/libs/bundlednotsiloed-26.3-fabric-1.5.1.jar
            stacks-not-slots/ports/26.3-fabric/build/libs/stacksnotslots-26.3-fabric-1.1.jar
