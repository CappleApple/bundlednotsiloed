name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bundled Not Siloed
        uses: actions/checkout@v4
        with:
          path: bundled-not-siloed
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout Stacks Not Slots
        uses: actions/checkout@v4
        with:
          repository: CappleApple/stacksnotslots
          path: stacks-not-slots

      - name: Checkout Panels Not Screens
        uses: actions/checkout@v4
        with:
          repository: CappleApple/panelsnotscreens
          path: panels-not-screens

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        working-directory: bundled-not-siloed
        run: ./gradlew build -PskipOptionalCompatRuntime
