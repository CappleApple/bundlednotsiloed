plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.java.exclude('**/compat/emi/**') // No upstream EMI release exists for Minecraft 26.2.

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

repositories {
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.terraformersmc.com/releases' }
}

base {
    archivesName = mod_id + '-26.2-neoforge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version


    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        clientSmoke {
            client()
            gameDirectory = project.file("run-client-smoke")
            systemProperty "bundlednotsiloed.clientSmoke", "true"
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        serverSmoke {
            server()
            programArgument "--nogui"
            gameDirectory = project.file("run-server-smoke")
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', "${project.mod_id},minecraft"
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "com.cappleapple:stacksnotslots:${stacks_not_slots_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    def localJei = fileTree('modstotestwith') { include 'jei-*.jar' }
    def localEmi = fileTree('modstotestwith') { include 'emi-*.jar' }
    def localSophisticated = fileTree('modstotestwith') { include 'sophisticated*.jar' }
    def localMouseTweaks = fileTree('modstotestwith') { include 'MouseTweaks-*.jar' }
    def localTomsStorage = fileTree('modstotestwith') { include 'toms_storage-*.jar' }
    if (!localJei.files.isEmpty()) compileOnly files(localJei)
    else compileOnly 'mezz.jei:jei-26.2-neoforge-api:30.32.0.222'
    if (!project.hasProperty('skipOptionalCompatRuntime')) {
        localRuntime files(localJei, localEmi, localSophisticated, localMouseTweaks, localTomsStorage)
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version          : minecraft_version,
            minecraft_version_range    : minecraft_version_range,
            neo_version                : neo_version,
            loader_version_range       : loader_version_range,
            mod_id                     : mod_id,
            mod_name                   : mod_name,
            mod_license                : mod_license,
            mod_version                : mod_version,
            stacks_not_slots_version   : stacks_not_slots_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xmaxerrs', '1000'])
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Keep the opt-in client gate muted and windowed on a fresh checkout.
tasks.matching { it.name == 'runClientSmoke' }.configureEach {
    doFirst {
        def options = file('run-client-smoke/options.txt')
        options.parentFile.mkdirs()
        options.text = "soundCategory_master:0.0\npauseOnLostFocus:false\nfullscreen:false\nrawMouseInput:false\nmaxFps:30\n"
    }
}

// Include the project license and its additional modpack/server permission.
tasks.named('jar') { from('LICENSE') }
