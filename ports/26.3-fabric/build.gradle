plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'maven-publish'
}
def gameplayResume = project.hasProperty('clientGameplayResume')
def clientAuditOptions = file('run-client-smoke/options.txt')
def clientAuditFailure = file('run-client-smoke/gameplay-failed.txt')
def clientAuditPassed = file('run-client-smoke/' + (gameplayResume ? 'BNS_GAMEPLAY_RESUME_PASSED' : 'BNS_GAMEPLAY_PASSED') + '.txt')
version = mod_version
group = 'com.cappleapple'
base.archivesName = 'bundlednotsiloed-26.3-fabric'
repositories {
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.terraformersmc.com/releases' }
    mavenCentral()
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation 'com.cappleapple:stacksnotslots:1.1'
    compileOnly 'mezz.jei:jei-26.3-fabric-api:31.0.0.11'
    implementation include('com.electronwill.night-config:core:3.8.3')
    implementation include('com.electronwill.night-config:toml:3.8.3')
    testImplementation 'net.fabricmc:fabric-loader-junit:0.19.5'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand(version: project.version) } }
test { useJUnitPlatform() }
loom {
    runs { client { vmArg '-Dorg.lwjgl.glfw.checkThread0=false' }; server { programArg '--nogui' } }
}

loom.runs { gameTestServer { server(); name 'GameTest'; vmArg '-Dfabric-api.gametest'; vmArg '-Dfabric-api.gametest.report-file=build/gametest-results.xml'; runDir 'run-gametest' } }

sourceSets.main.java.exclude('**/compat/emi/**')
tasks.withType(JavaCompile).configureEach { options.compilerArgs.addAll(['-Xmaxerrs','1000']) }

loom.runs { clientSmoke { client(); vmArg '-Dbundlednotsiloed.clientSmoke=true'; runDir 'run-client-smoke' } }

loom.runs { serverSmoke { server(); programArg '--nogui'; runDir 'run-server-validation' } }

tasks.matching { it.name == 'runClientSmoke' }.configureEach {
    doFirst {
        def options = clientAuditOptions
        options.parentFile.mkdirs()
        options.text = "soundCategory_master:0.0\npauseOnLostFocus:false\nfullscreen:false\nrawMouseInput:false\nmaxFps:30\nguiScale:2\nlang:" + (gameplayResume ? "de_de" : "en_us") + "\n"
    }
}

// Include the project license and its additional modpack/server permission.
tasks.named('jar') { from('LICENSE') }

// In-world gameplay audit: use a disposable copied world and never capture user input.
if (project.hasProperty("clientGameplay")) {
    loom.runs.clientSmoke {
        vmArg "-Dbundlednotsiloed.clientGameplay=true"
        vmArg "-Dbundlednotsiloed.clientGameplayResume=" + gameplayResume
        programArgs "--quickPlaySingleplayer", "BNS-Audit", "--username", "BNSAudit", "--width", "1280", "--height", "720"
    }

}

if (project.hasProperty('clientGameplay')) {
    tasks.named('runClientSmoke').configure {
        doFirst {
            clientAuditFailure.delete()
            clientAuditPassed.delete()
        }
        doLast {
            def passed = clientAuditPassed
            if (!passed.exists() || clientAuditFailure.exists()) {
                throw new GradleException('Client gameplay assertions failed; inspect the client log.')
            }
        }
    }
}
