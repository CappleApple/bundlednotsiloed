modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/CappleApple/bundlednotsiloed/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/CappleApple/bundlednotsiloed"
authors="CappleApple"
logoFile="assets/bundlednotsiloed/textures/gui/bundled-not-siloed-logo.png"
logoBlur=false
description='''
Player-facing capacity inventory overhaul powered by Stacks Not Slots and Panels Not Screens.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="stacksnotslots"
    type="required"
    versionRange="[${stacks_not_slots_version},)"
    ordering="BEFORE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="panelsnotscreens"
    type="required"
    versionRange="[${panels_not_screens_version},)"
    ordering="BEFORE"
    side="CLIENT"
